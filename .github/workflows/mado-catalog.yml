name: Mado catalog and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    # 微信侧的码可能已失效（尤其 develop 版随会话过期），手工触发时可选强制重算。
    inputs:
      force_codes:
        description: 强制重新申领全部小程序码（忽略已有码的元数据匹配）
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# 所有 main 发布串行运行；运行时检出最新 main，避免旧事件覆盖新清单。
concurrency:
  group: mado-pages-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test generators without network
        run: node --test scripts/mado-generators.test.mjs
      - name: Generate catalog, optional official codes and READMEs
        env:
          MADO_WECHAT_APPID: ${{ vars.MADO_WECHAT_APPID }}
          MADO_WECHAT_ENV_VERSION: ${{ vars.MADO_WECHAT_ENV_VERSION }}
          MADO_WECHAT_SECRET: ${{ secrets.MADO_WECHAT_SECRET }}
          MADO_WECHAT_ACCESS_TOKEN: ${{ secrets.MADO_WECHAT_ACCESS_TOKEN }}
          MADO_FORCE_CODES: ${{ inputs.force_codes }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { generateQrcodes } from './scripts/generate-mado-qrcodes.mjs';
          const force = process.env.MADO_FORCE_CODES === 'true';
          const result = await generateQrcodes({ env: process.env, force });
          const files = ['mado/demos.json', 'mado/index.html', 'README.md', 'mado/README.md', ...result.generatedFiles];
          await writeFile(`${process.env.RUNNER_TEMP}/mado-generated-paths`, files.join('\0') + '\0');
          await writeFile(`${process.env.RUNNER_TEMP}/mado-result.json`, JSON.stringify(result));
          console.log(`官方码 ${result.generatedFiles.length / 2} 个；待生成：${result.pending.join('、') || '无'}`);
          if (!result.credentials) console.log('未配置凭据，待授权生成；继续正常部署。');
          // 生码失败只警告：内容必须先上线，码等下次成功后自动补齐，不能因为码卡住整站。
          for (const error of result.errors) console.warn(`::warning title=小程序码未生成::${error.dir}：${error.message}`);
          NODE
      - name: Commit only changed generated files
        shell: bash
        run: |
          git add --pathspec-from-file="$RUNNER_TEMP/mado-generated-paths" --pathspec-file-nul
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update Mado catalog and official codes"
            git push origin HEAD:main
          fi
      - name: Mirror to Gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_URL: ${{ vars.GITEE_URL }}
        run: |
          # 镜像只做国内可读与备份：Gitee Pages 已下线，gitee.io 也无法备案，
          # 小程序取数不能依赖它。推送失败不阻断发布。
          set -o pipefail
          url="${GITEE_URL:-https://gitee.com/manymore13/img.git}"
          case "$url" in
            https://gitee.com/*)
              if [ -z "$GITEE_TOKEN" ]; then
                echo "未配置 GITEE_TOKEN，跳过 Gitee 镜像。"
                exit 0
              fi
              url="https://oauth2:${GITEE_TOKEN}@${url#https://}"
              ;;
          esac
          # token 只出现在这条命令里，输出统一打码，避免进日志。
          if git push "$url" HEAD:main 2>&1 | sed "s#${GITEE_TOKEN:-__none__}#***#g"; then
            echo "已同步到 Gitee：$(git rev-parse --short HEAD)"
          else
            echo "::warning title=Gitee 镜像失败::推送被拒绝或网络异常；GitHub 侧内容与 Pages 发布不受影响。"
          fi
      - name: Prepare complete Pages snapshot
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mado-pages"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/mado-pages"
          touch "$RUNNER_TEMP/mado-pages/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mado-pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summarize demos and codes
        if: always()
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';
          const lines = ['## Mado demo 发布结果', ''];
          if (process.env.PAGE_URL) lines.push(`扫码目录：${process.env.PAGE_URL}mado/`, '');
          try {
            const result = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/mado-result.json`, 'utf8'));
            lines.push(`- 码绑定版本：\`${result.envVersion}\`${result.force ? '（强制重算）' : ''}`);
            lines.push(`- 新生成小程序码：${result.generatedFiles.length / 2} 个`);
            lines.push(`- 待生成：${result.pending.join('、') || '无'}`);
            lines.push(`- 凭据：${result.credentials ? '已配置' : '未配置（在 Actions Secrets 加 MADO_WECHAT_SECRET 后自动补齐）'}`);
            for (const error of result.errors) lines.push(`- ⚠️ ${error.dir}：${error.message}`);
          } catch {
            lines.push('- 未能读取生成结果，请查看上一步日志。');
          }
          console.log(lines.join('\n'));
          NODE
